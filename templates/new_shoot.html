{% extends "base.html" %}
{% block title %}New Collection — Nocturne Studio{% endblock %}
{% block content %}
<section class="form-page shell">
  <div class="eyebrow">02 / New collection <i></i> Private by default</div>
  <div class="form-layout"><div><h1>Set the<br><em>scene.</em></h1><p class="form-intro">Give this story a name, then bring it to life with your images.</p></div>
  <form method="post" enctype="multipart/form-data" class="shoot-form">
    <label>Collection name<input name="name" type="text" placeholder="e.g. After the rain" required></label>
    <label>Client / subject<input name="client" type="text" placeholder="e.g. Elena & James" required></label>
    <label>Photographs <span class="label-note">JPG, PNG, WEBP or GIF · 64 MB total</span><div class="dropzone" id="dropzone"><input id="photos" name="photos" type="file" accept="image/*" multiple required><span class="upload-icon">↑</span><strong>Drop your frames here</strong><small>or click to browse your files</small><div id="file-list"></div></div></label>
    <button class="button submit-button" type="submit">Create collection <span>↗</span></button>
  </form></div>
</section>
{% endblock %}
